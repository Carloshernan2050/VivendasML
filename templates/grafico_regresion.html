<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Regresión Lineal - Precio vs m²</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container my-5">
        <div class="titulo-grafico mb-4">
            <h2>Gráfico con Línea de Regresión: Precio vs Precio/m²</h2>
            <p class="lead text-white mt-3">🔢 Total de viviendas analizadas: <strong>{{ total_viviendas }}</strong></p>
        </div>

        <canvas id="regresionChart" width="800" height="400"></canvas>

        <a href="{{ url_for('vivienda.index') }}" class="btn btn-negro mt-4">← Volver al inicio</a>
    </div>

    <script>
        const puntos = {{ puntos | tojson }};
        const linea = [
            { x: {{ min_x }}, y: {{ min_y }} },
            { x: {{ max_x }}, y: {{ max_y }} }
        ];

        const datasets = [
            {
                label: "Viviendas",
                data: puntos.map(p => ({ x: p.precio, y: p.m2 })),
                backgroundColor: "rgba(0, 123, 255, 0.7)"
            },
            {
                label: "Regresión Lineal",
                data: linea,
                borderColor: "rgba(0, 0, 0, 0.9)",
                borderWidth: 2,
                type: "line",
                fill: false,
                pointRadius: 0
            }
        ];

        new Chart(document.getElementById('regresionChart'), {
            type: 'scatter',
            data: { datasets },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Precio total ($)' } },
                    y: { title: { display: true, text: 'Precio por m² ($/m²)' } }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Regresión Lineal: Precio vs Precio por m²'
                    },
                    tooltip: {
                        callbacks: {
                            label: ctx => ctx.dataset.label === "Regresión Lineal"
                                ? null
                                : `Precio: $${ctx.parsed.x.toLocaleString()}, $/m²: $${ctx.parsed.y}`
                        }
                    },
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#000',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
