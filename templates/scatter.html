<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagrama de Dispersión - Precio vs m²</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container my-5">
        <div class="titulo-grafico mb-4">
            <h2>Diagrama de Dispersión: Precio Total vs Valor por m²</h2>
        </div>

        <canvas id="scatterChart" width="800" height="400"></canvas>

        <a href="{{ url_for('vivienda.index') }}" class="btn btn-negro mt-4">← Volver al inicio</a>
    </div>

    <script>
        const puntos = {{ puntos | tojson }};
        const colores = {
            "Casa": "rgba(0, 0, 0, 0.8)",              
            "Apartamento": "rgba(255, 0, 0, 0.7)",     
            "Otros": "rgba(0, 123, 255, 0.8)"        
        };

        const datasets = ["Casa", "Apartamento", "Otros"].map(tipo => ({
            label: tipo,
            data: puntos.filter(p => p.tipo === tipo).map(p => ({ x: p.precio, y: p.m2 })),
            backgroundColor: colores[tipo]
        }));

        new Chart(document.getElementById('scatterChart'), {
            type: 'scatter',
            data: { datasets },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Precio total ($)' } },
                    y: { title: { display: true, text: 'Precio por m² ($/m²)' } }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Relación entre Precio y Precio por m² por tipo de vivienda'
                    },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `Precio: $${ctx.parsed.x.toLocaleString()}, $/m²: $${ctx.parsed.y}`
                        }
                    },
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#000',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
