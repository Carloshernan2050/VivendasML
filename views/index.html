<!-- views/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Predicción de Precio</title>
</head>
<body>
  <h1>Estimador de precio de vivienda</h1>
  <form action="/predecir" method="POST">
    <label for="area">Área (m²):</label>
    <input type="number" name="area" step="0.1" required><br><br>

    <label for="antiguedad">Año de construcción:</label>
    <input type="number" name="antiguedad" min="1900" max="2025" required><br><br>

    <button type="submit">Predecir precio</button>
  </form>
</body>
</html>
