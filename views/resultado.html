<!-- views/resultado.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Resultado de la predicción</title>
</head>
<body>
  <h1>Resultado</h1>
  <p><strong>Área:</strong> {{ area }} m²</p>
  <p><strong>Antigüedad (años):</strong> {{ antiguedad }}</p>
  <p><strong>Precio estimado:</strong> ${{ precio }}</p>
  <hr>
  <h3>Detalles del modelo</h3>
  <p><strong>Intercepto:</strong> {{ intercepto }}</p>
  <p><strong>Coeficiente Área:</strong> {{ coef_area }}</p>
  <p><strong>Coeficiente Antigüedad:</strong> {{ coef_antig }}</p>
  <br>
  <a href="/">🔙 Volver</a>
</body>
</html>
